web01 int=5 neg=-7 hex=0x1F oct=0o17 bin=0b101 under=1_000 big=123456789012345678901234567890
web02 flt=1.5 exp=1e3 dot=5. lead=.25 tiny=1e-5 huge=1e16 neg0=-0.0
web03 t=True f=False n=None word=yes Yes=true zero=0 lz=01 lzz=00
web04 dq="two words" sq='single' esc=a\ b mixed=a"b c"d empty= emptyq="" hash=a#b ignored=gone
web05 lst="[1, 'two', 3.0]" tup="(1, 2)" one=1, dct="{'a': 1, 'b': [True, None]}" nested="[[1], {'k': (2,)}]"
