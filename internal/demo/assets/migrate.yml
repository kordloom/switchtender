---
# The Migrate database template runs this. A template whose History is empty reads as a feature that
# does not work, so every seeded template has at least one run behind it.
- name: Migrate database
  hosts: db*
  connection: local
  gather_facts: false
  tasks:
    - name: Check schema version
      shell: |
        echo "current schema revision 41 on {{ inventory_hostname }}"
      changed_when: false
    - name: Take a pre-migration snapshot
      command: "sleep {{ work | default(1) }}"
      changed_when: true
    - name: Apply pending migrations
      shell: |
        echo "applying 42_add_run_task_summary_index"
        echo "applying 43_backfill_install_id"
        echo "2 migrations applied, schema revision 43"
      changed_when: true
    - name: Verify the schema
      debug:
        msg: "schema revision 43 verified on {{ inventory_hostname }}"
