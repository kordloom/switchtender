<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Schedules - Yardmaster</title>
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="schedules">
	<header class="topbar">
		<div class="brand"><a href="/ui/">Yardmaster</a></div>
		<div class="tagline">Schedules</div>
	</header>

	<main class="content">
		<a class="back" href="/ui/">Back to runs</a>
		<h1>Schedules</h1>
		<p class="muted">Recurring runs fired on a cron cadence.</p>
		<div id="status" class="muted">Loading schedules.</div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Name</th>
					<th>Cron</th>
					<th>Target</th>
					<th>Enabled</th>
					<th>Next run</th>
					<th>Last run</th>
				</tr>
			</thead>
			<tbody id="schedules"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
