<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Audit - SwitchTender</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="audit"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="SwitchTender"></picture>SwitchTender</a></div>
	</header>

	<main class="content">
		<div class="page-head">
			<div class="page-head-text">
				<h1>Audit</h1>
				<p class="muted">Every change is linked into a tamper-evident hash chain. Verify it, or download a signed LoomSeal bundle that anyone can check offline with an open tool.</p>
			</div>
			<div class="head-actions">
				<span id="audit-badge" class="chip none" hidden></span>
				<button id="audit-verify" class="button">Verify chain</button>
				<button id="audit-bundle" class="button primary">Download bundle</button>
				<button id="audit-register" class="button">Evidence pack</button>
			</div>
		</div>

		<div id="status" class="muted">Loading audit trail.</div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>#</th>
					<th>Time</th>
					<th>Actor</th>
					<th>Change</th>
					<th>Method</th>
					<th>Path</th>
					<th>Hash</th>
				</tr>
			</thead>
			<tbody id="audit"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
