<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Drift - SwitchTender</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="drift"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="SwitchTender"></picture>SwitchTender</a></div>
	</header>

	<main class="content">
		<a class="back" href="/ui/">Back to overview</a>
		<h1>Drift</h1>
		<p class="muted">How far each host has diverged from the desired state. A drift check is a dry run, where a change it would make is a divergence from the playbook. Run a dry run to refresh a host's drift.</p>
		<div id="drift-summary" class="summary" hidden></div>
		<div id="status" class="muted">Loading drift status.</div>
		<div class="list-scroll">
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Host</th>
					<th>State</th>
					<th>Drifted tasks</th>
					<th>Last checked</th>
					<th>Run</th>
					<th class="col-actions">Actions</th>
				</tr>
			</thead>
			<tbody id="drift"></tbody>
		</table>
		</div>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
