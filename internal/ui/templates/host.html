<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Host {{.Host}} - SwitchTender</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="host" data-host="{{.Host}}"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="SwitchTender"></picture>SwitchTender</a></div>
	</header>

	<main class="content">
		<a class="back" href="/ui/fleet">Back to fleet</a>
		<div class="page-head">
			<div class="page-head-text">
				<h1 class="mono">{{.Host}}</h1>
				<p class="muted">Everything this host has done, and what it looks like right now.</p>
			</div>
			<div class="head-actions" id="host-actions"></div>
		</div>

		<div class="summary" id="host-summary" hidden></div>

		<section class="panel" id="host-facts" hidden>
			<div class="panel-head">
				<h2>System facts</h2>
				<span id="host-facts-note" class="muted"></span>
			</div>
			<div class="view-rows" id="host-facts-body"></div>
		</section>
		<div id="status" class="muted">Loading host history.</div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Run</th>
					<th>Outcome</th>
					<th>OK</th>
					<th>Changed</th>
					<th>Failed</th>
					<th>Busy time</th>
					<th>When</th>
				</tr>
			</thead>
			<tbody id="host-history"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
