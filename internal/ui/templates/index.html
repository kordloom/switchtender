<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Yardmaster</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="index">
	<header class="topbar">
		<div class="brand"><img class="brand-logo" src="/ui/assets/logo.png" alt="">Yardmaster</div>
		<div class="tagline">Playbook execution and fleet orchestration</div>
		<nav class="nav">
			<a href="/ui/fleet">Fleet health</a>
			<a href="/ui/tasks">Task trends</a>
			<a href="/ui/schedules">Schedules</a>
		</nav>
	</header>

	<main class="content">
		<h1>Runs</h1>
		<div id="status" class="muted">Loading runs.</div>
		<div class="summary" id="summary" hidden></div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Status</th>
					<th>Run</th>
					<th>Playbook</th>
					<th>Started</th>
					<th>Duration</th>
				</tr>
			</thead>
			<tbody id="runs"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
