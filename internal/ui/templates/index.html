<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Yardmaster</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="index"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><img class="brand-logo" src="/ui/assets/logo.png" alt="">Yardmaster</div>
		<div class="tagline">Playbook execution and fleet orchestration</div>
		<nav class="nav">
			<a href="/ui/fleet">Fleet health</a>
			<a href="/ui/tasks">Task trends</a>
			<a href="/ui/workers">Workers</a>
			<a href="/ui/projects">Projects</a>
			<a href="/ui/inventories">Inventories</a>
			<a href="/ui/sources">Sources</a>
			<a href="/ui/templates">Templates</a>
			<a href="/ui/credentials">Credentials</a>
			<a href="/ui/users">Users</a>
			<a href="/ui/schedules">Schedules</a>
			<a href="/ui/docs">Docs</a>
		</nav>
	</header>

	<main class="content">
		<section class="panel" id="launch-panel">
			<div class="panel-head">
				<h2>Launch a run</h2>
			</div>
			<form id="launch-form" class="launch-grid">
				<label class="field-label">Project
					<select id="launch-project" class="input"><option value="">None, local paths</option></select>
				</label>
				<label class="field-label">Playbook
					<input id="launch-playbook" class="input mono" placeholder="plays/site.yml" required>
				</label>
				<label class="field-label">Inventory
					<input id="launch-inventory" class="input mono" placeholder="/srv/ansible/hosts.ini">
				</label>
				<label class="field-label">Stored inventory
					<select id="launch-inventory-id" class="input"><option value="">None, use the path</option></select>
				</label>
				<label class="field-label">Shards
					<input id="launch-shards" class="input" type="number" min="0" max="64" placeholder="0">
				</label>
				<label class="field-label">Queue
					<input id="launch-queue" class="input mono" placeholder="default">
				</label>
				<label class="field-label">Credentials
					<select id="launch-credentials" class="input" multiple size="3"></select>
				</label>
				<div class="launch-actions">
					<button type="submit" class="button primary">Launch</button>
					<span id="launch-status" class="muted"></span>
				</div>
			</form>
		</section>

		<h1>Runs</h1>
		<div id="status" class="muted">Loading runs.</div>
		<div class="summary" id="summary" hidden></div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Status</th>
					<th>Run</th>
					<th>Playbook</th>
					<th>Started</th>
					<th>Duration</th>
				</tr>
			</thead>
			<tbody id="runs"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
