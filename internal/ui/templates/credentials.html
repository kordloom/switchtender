<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Credentials - SwitchTender</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="credentials"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="SwitchTender"></picture>SwitchTender</a></div>
	</header>

	<main class="content">
		<div class="page-head">
			<div class="page-head-text">
				<h1>Credentials</h1>
				<p class="muted">Secrets are encrypted at rest and never shown again after saving.</p>
			</div>
			<button id="cred-open" class="button primary">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
				New credential
			</button>
		</div>

		<div id="cred-modal" class="modal" hidden>
			<div class="modal-card wide">
				<div class="modal-head">
					<h2>Add a credential</h2>
					<button type="button" class="modal-close" id="cred-close" aria-label="Close">&times;</button>
				</div>
			<form id="cred-form" class="stack">
				<label class="field-label">Name
					<input id="cred-name" class="input" placeholder="prod-fleet-key" required>
				</label>
				<label class="field-label">Kind
					<select id="cred-kind" class="input">
						<optgroup label="Ansible connection">
							<option value="ssh_key">SSH private key</option>
							<option value="ssh_password">SSH password</option>
							<option value="network">Network device login</option>
						</optgroup>
						<optgroup label="Ansible vault and privilege escalation">
							<option value="vault_password">Ansible Vault password</option>
							<option value="become_password">Become password</option>
							<option value="become">Become, with method and user</option>
						</optgroup>
						<optgroup label="Any tool">
							<option value="env">Environment variables</option>
							<option value="token">API token or JWT</option>
							<option value="registry">Container registry login</option>
						</optgroup>
						<optgroup label="Cloud and platform">
							<option value="aws">AWS access key</option>
							<option value="azure">Azure service principal</option>
							<option value="gcp">Google service account</option>
							<option value="vmware">VMware vCenter</option>
						</optgroup>
					</select>
					<span id="cred-kind-hint" class="field-hint"></span>
				</label>
				<label class="field-label">Source
					<select id="cred-source" class="input">
						<option value="local">Stored value</option>
						<option value="command">Command (fetch at run time)</option>
						<option value="vault">Vault (fetch at run time)</option>
						<option value="vault_dynamic">Vault dynamic (short-lived, minted per run)</option>
						<option value="gsm">Google Secret Manager (fetch at run time)</option>
						<option value="aws">AWS Secrets Manager (fetch at run time)</option>
						<option value="aws_sts">AWS STS (short-lived role credentials, minted per run)</option>
						<option value="azure">Azure Key Vault (fetch at run time)</option>
						<option value="conjur">CyberArk Conjur (fetch at run time)</option>
						<option value="ccp">CyberArk Central Credential Provider (fetch at run time)</option>
						<option value="onepassword">1Password Connect (fetch at run time)</option>
					</select>
					<span id="cred-source-hint" class="field-hint"></span>
				</label>
				<label class="field-label">Secret
					<textarea id="cred-secret" class="input mono" rows="6"
						placeholder="-----BEGIN OPENSSH PRIVATE KEY-----" required></textarea>
				</label>
				<label class="field-label" id="cred-passphrase-field" hidden>Key passphrase
					<input id="cred-passphrase" class="input" type="password" autocomplete="off"
						placeholder="Unlocks an encrypted private key at run time">
					<span class="muted">Optional. Only for a locally stored SSH key that is passphrase protected.</span>
				</label>
				<div class="launch-actions">
					<button type="submit" class="button primary">Save</button>
					<span id="cred-status" class="muted"></span>
				</div>
			</form>
			</div>
		</div>

		<div id="status" class="muted">Loading credentials.</div>
		<div id="cred-needs" class="cred-needs" hidden></div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Name</th>
					<th>Kind</th>
					<th>Source</th>
					<th>Secret</th>
					<th>Used by</th>
					<th>Created</th>
					<th class="col-actions">Actions</th>
				</tr>
			</thead>
			<tbody id="credentials"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
