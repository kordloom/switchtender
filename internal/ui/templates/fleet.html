<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fleet health - Yardmaster</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="fleet"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="Yardmaster"></picture>Yardmaster</a></div>
	</header>

	<main class="content">
		<a class="back" href="/ui/">Back to runs</a>
		<h1>Fleet health</h1>
		<p class="muted">Hosts ranked by failures across their most recent runs.</p>
		<div id="status" class="muted">Loading fleet health.</div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Host</th>
					<th>Recent failures</th>
					<th>Stability</th>
					<th>Recent</th>
					<th>Runs</th>
					<th>Last outcome</th>
					<th>Last run</th>
				</tr>
			</thead>
			<tbody id="fleet"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
