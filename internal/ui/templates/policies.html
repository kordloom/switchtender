<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Policies - Yardmaster</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="policies"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="Yardmaster"></picture>Yardmaster</a></div>
	</header>

	<main class="content">
		<div class="page-head">
			<div class="page-head-text">
				<h1>Approval policies</h1>
				<p class="muted">A policy holds every run it matches for approval, so the gate cannot be skipped. An empty field matches any value.</p>
			</div>
			<button id="policy-open" class="button primary">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
				New policy
			</button>
		</div>

		<div id="policy-modal" class="modal" hidden>
			<div class="modal-card wide">
				<div class="modal-head">
					<h2>Add a policy</h2>
					<button type="button" class="modal-close" id="policy-close" aria-label="Close">&times;</button>
				</div>
			<form id="policy-form" class="stack">
				<label class="field-label">Name
					<input id="policy-name" class="input" placeholder="prod terraform destroy" required>
				</label>
				<label class="field-label">Tool
					<select id="policy-tool" class="input">
						<option value="">Any tool</option>
						<option value="ansible">Ansible</option>
						<option value="bash">Bash</option>
						<option value="terraform">Terraform</option>
						<option value="opentofu">OpenTofu</option>
						<option value="python">Python</option>
						<option value="powershell">PowerShell</option>
						<option value="go">Go</option>
					</select>
				</label>
				<label class="field-label">Command contains
					<input id="policy-command" class="input mono" placeholder="destroy">
				</label>
				<label class="field-label">Inventory
					<select id="policy-inventory" class="input"><option value="">Any inventory</option></select>
				</label>
				<label class="field-label check-label">
					<input id="policy-exclude-dry" type="checkbox">
					Skip dry runs, so a no-change preview does not need approval
				</label>
				<div class="launch-actions">
					<button type="submit" class="button primary">Save</button>
					<span id="policy-status" class="muted"></span>
				</div>
			</form>
			</div>
		</div>

		<div id="status" class="muted">Loading policies.</div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Name</th>
					<th>Tool</th>
					<th>Command contains</th>
					<th>Inventory</th>
					<th>Skip dry runs</th>
					<th>Created</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="policies"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
