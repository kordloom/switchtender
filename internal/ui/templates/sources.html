<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inventory sources - SwitchTender</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="sources"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="SwitchTender"></picture>SwitchTender</a></div>
	</header>

	<main class="content">
		<div class="page-head">
			<div class="page-head-text">
				<h1>Inventory sources</h1>
				<p class="muted">A source runs an inventory plugin or script and refreshes the hosts into a stored inventory you can run against.</p>
			</div>
			<button id="source-open" class="button primary">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
				New source
			</button>
		</div>

		<div id="source-modal" class="modal" hidden>
			<div class="modal-card wide">
				<div class="modal-head">
					<h2>Add a source</h2>
					<button type="button" class="modal-close" id="source-close" aria-label="Close">&times;</button>
				</div>
			<form id="source-form" class="launch-grid">
				<label class="field-label">Name
					<input id="src-name" class="input" placeholder="aws production" required>
				</label>
				<label class="field-label">Source
					<input id="src-source" class="input mono" placeholder="aws_ec2.yml or ./inventory.sh" required>
				</label>
				<label class="field-label">Env credential
					<select id="src-credential" class="input"><option value="">None</option></select>
				</label>
				<label class="field-label">Project
					<select id="src-project" class="input"><option value="">None, local path</option></select>
				</label>
				<label class="field-label">Refresh every
					<input id="src-interval" class="input mono" placeholder="15m">
					<span class="field-hint">How often to re-read the source: 30s, 15m, or 2h. Empty means only when asked.</span>
				</label>
				<label class="field-label check-label">
					<input id="src-update-on-launch" type="checkbox">
					Refresh before each launch, so a run targets the fleet as it is now
				</label>
				<div class="launch-actions">
					<button type="submit" class="button primary">Save</button>
					<span id="src-status" class="muted"></span>
				</div>
			</form>
			</div>
		</div>

		<div id="status" class="muted">Loading sources.</div>
		<div class="list-scroll">
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Name</th>
					<th>Plugin or script</th>
					<th>Keeps updated</th>
					<th>Refresh</th>
					<th>Last synced</th>
					<th>Status</th>
					<th class="col-actions">Actions</th>
				</tr>
			</thead>
			<tbody id="sources"></tbody>
		</table>
		</div>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
