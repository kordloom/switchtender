<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inventory sources - Yardmaster</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="sources">
	<header class="topbar">
		<div class="brand"><a href="/ui/"><img class="brand-logo" src="/ui/assets/logo.png" alt="">Yardmaster</a></div>
		<div class="tagline">Inventory sources</div>
	</header>

	<main class="content">
		<a class="back" href="/ui/">Back to runs</a>
		<h1>Inventory sources</h1>
		<p class="muted">A source runs an inventory plugin or script and refreshes the hosts into a stored inventory you can run against.</p>

		<section class="panel">
			<div class="panel-head"><h2>Add a source</h2></div>
			<form id="source-form" class="launch-grid">
				<label class="field-label">Name
					<input id="src-name" class="input" placeholder="aws production" required>
				</label>
				<label class="field-label">Source
					<input id="src-source" class="input mono" placeholder="aws_ec2.yml or ./inventory.sh" required>
				</label>
				<label class="field-label">Env credential
					<select id="src-credential" class="input"><option value="">None</option></select>
				</label>
				<label class="field-label">Project
					<select id="src-project" class="input"><option value="">None, local path</option></select>
				</label>
				<div class="launch-actions">
					<button type="submit" class="button primary">Save</button>
					<span id="src-status" class="muted"></span>
				</div>
			</form>
		</section>

		<div id="status" class="muted">Loading sources.</div>
		<table class="runs" hidden>
			<thead>
				<tr>
					<th>Name</th>
					<th>Source</th>
					<th>Last synced</th>
					<th>Status</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="sources"></tbody>
		</table>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
