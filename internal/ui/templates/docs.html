<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Title}} - SwitchTender docs</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="docs">
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="SwitchTender"></picture>SwitchTender</a></div>
	</header>

	<main class="content docs-page">
		<div class="docs-layout">
			<nav class="docs-nav" aria-label="Documentation pages">
				<div class="nav-group-label">Guides</div>
				<input id="docs-filter" class="input docs-filter" type="search" placeholder="Filter guides" aria-label="Filter guides">
				<ul id="docs-list">
					{{range .Pages}}
					<li><a href="{{.Href}}"{{if .Active}} class="active" aria-current="page"{{end}}>{{.Title}}</a></li>
					{{end}}
				</ul>
				<p id="docs-empty" class="muted docs-empty" hidden>No guide matches.</p>
			</nav>
			<article class="docs-content">
				{{.Content}}
				<nav class="docs-pager" id="docs-pager" aria-label="Guide navigation"></nav>
			</article>
			<aside class="docs-toc" id="docs-toc" aria-label="On this page"></aside>
		</div>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
