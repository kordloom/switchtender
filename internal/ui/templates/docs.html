<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Title}} - Yardmaster docs</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
	<style>
		.docs-layout { display: flex; gap: 32px; align-items: flex-start; }
		.docs-nav { flex: 0 0 220px; position: sticky; top: 16px; }
		.docs-nav ul { list-style: none; padding: 0; margin: 0; }
		.docs-nav li { margin: 2px 0; }
		.docs-nav a { display: block; padding: 6px 10px; border-radius: 6px; text-decoration: none;
			color: inherit; opacity: 0.8; }
		.docs-nav a:hover { opacity: 1; background: rgba(127,127,127,0.12); }
		.docs-nav a.active { opacity: 1; background: rgba(127,127,127,0.18); font-weight: 600; }
		.docs-content { flex: 1 1 auto; min-width: 0; max-width: 820px; line-height: 1.6; }
		.docs-content h1 { margin-top: 0; }
		.docs-content h2 { margin-top: 1.6em; padding-top: 0.4em;
			border-top: 1px solid rgba(127,127,127,0.2); }
		.docs-content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 0.9em; background: rgba(127,127,127,0.15); padding: 0.1em 0.35em; border-radius: 4px; }
		.docs-content pre { background: rgba(127,127,127,0.12); padding: 12px 14px; border-radius: 8px;
			overflow-x: auto; }
		.docs-content pre code { background: none; padding: 0; }
		.docs-content table { border-collapse: collapse; width: 100%; margin: 1em 0; display: block;
			overflow-x: auto; }
		.docs-content th, .docs-content td { border: 1px solid rgba(127,127,127,0.28);
			padding: 6px 10px; text-align: left; vertical-align: top; }
		.docs-content th { background: rgba(127,127,127,0.12); }
		.docs-content blockquote { margin: 1em 0; padding: 0.2em 1em;
			border-left: 3px solid rgba(127,127,127,0.4); opacity: 0.9; }
		.docs-content a { color: inherit; }
	</style>
</head>
<body data-page="docs">
	<header class="topbar">
		<div class="brand"><a href="/ui/"><img class="brand-logo" src="/ui/assets/logo.png" alt="">Yardmaster</a></div>
		<div class="tagline">Docs</div>
	</header>

	<main class="content">
		<a class="back" href="/ui/">Back to runs</a>
		<div class="docs-layout">
			<nav class="docs-nav">
				<ul>
					{{range .Pages}}
					<li><a href="{{.Href}}"{{if .Active}} class="active"{{end}}>{{.Title}}</a></li>
					{{end}}
				</ul>
			</nav>
			<article class="docs-content">
				{{.Content}}
			</article>
		</div>
	</main>
</body>
</html>
