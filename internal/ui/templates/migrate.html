<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Migrate - Yardmaster</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="migrate"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="Yardmaster"></picture>Yardmaster</a></div>
	</header>

	<main class="content">
		<div class="page-head">
			<div class="page-head-text">
				<h1>Migrate</h1>
				<p class="muted">Import projects, inventories, templates, and schedules from AWX or Semaphore.</p>
			</div>
		</div>

		<form id="migrate-form" class="stack">
			<label class="field-label">Format
				<select id="migrate-format" class="input">
					<option value="awx">AWX</option>
					<option value="semaphore">Semaphore</option>
				</select>
			</label>
			<label class="field-label">Export JSON
				<textarea id="migrate-export" class="input mono" rows="12"
					placeholder="Paste your AWX or Semaphore export JSON here"></textarea>
			</label>
			<div class="launch-actions">
				<button id="migrate-preview" type="button" class="button">Preview</button>
				<button id="migrate-apply" type="button" class="button primary">Import</button>
				<span id="migrate-status" class="muted"></span>
			</div>
		</form>

		<div id="migrate-plan"></div>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
