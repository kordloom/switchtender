<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Migrate - SwitchTender</title>
	<link rel="icon" type="image/png" href="/ui/assets/favicon.png">
	<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-page="migrate"{{if .ReadOnly}} data-readonly="true"{{end}}>
	<header class="topbar">
		<div class="brand"><a href="/ui/"><picture><source media="(prefers-color-scheme: dark)" srcset="/ui/assets/logo-train-tracks-dark.png"><img class="brand-logo" src="/ui/assets/logo-train-tracks.png" alt="SwitchTender"></picture>SwitchTender</a></div>
	</header>

	<main class="content">
		<div class="page-head">
			<div class="page-head-text">
				<h1>Migrate</h1>
				<p class="muted">Import projects, inventories, templates, and schedules from AWX, Semaphore, or Rundeck. Preview first. Nothing is created until you import.</p>
			</div>
			<div class="head-actions"></div>
		</div>

		<form id="migrate-form" class="stack">
			<label class="field-label">Format
				<select id="migrate-format" class="input">
					<option value="awx">AWX</option>
					<option value="semaphore">Semaphore</option>
					<option value="rundeck">Rundeck</option>
				</select>
			</label>
			<label class="field-label" id="migrate-inventory-field" hidden>Inventory
				<input id="migrate-inventory" class="input" type="text" placeholder="prod-hosts"
					data-tip="Rundeck dispatches by node filter and names no inventory, so say which hosts these jobs target">
				<span class="muted">Rundeck jobs name no inventory of their own, so say which hosts they target.</span>
			</label>
			<label class="field-label">Export
				<textarea id="migrate-export" class="input mono" rows="12"
					placeholder="Paste your AWX, Semaphore, or Rundeck export here"></textarea>
			</label>
			<div class="launch-actions">
				<button id="migrate-sample" type="button" class="button" data-tip="Click to fill the box with a sample AWX export so you can try the import">Load a sample export</button>
				<button id="migrate-preview" type="button" class="button" data-tip="Click to see exactly what would be created, without creating anything">Preview</button>
				<button id="migrate-apply" type="button" class="button primary" data-tip="Click to create every object in the plan">Import</button>
				<span id="migrate-status" class="muted"></span>
			</div>
		</form>

		<div id="migrate-plan"></div>
	</main>

	<script src="/ui/assets/app.js"></script>
</body>
</html>
