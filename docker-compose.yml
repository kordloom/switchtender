# A full Yardmaster deployment: the server, a PostgreSQL database, and one worker sharing it.
# Set YARDMASTER_ENCRYPTION_KEY and YARDMASTER_ENCRYPTION_SALT in the environment before running,
# then: docker compose up --build.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yard
      POSTGRES_PASSWORD: yard
      POSTGRES_DB: yard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yard"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    command: ["serve", "--addr", ":8080", "--db", "postgres://yard:yard@postgres:5432/yard?sslmode=disable"]
    environment:
      YARDMASTER_ENCRYPTION_KEY: ${YARDMASTER_ENCRYPTION_KEY:?set YARDMASTER_ENCRYPTION_KEY}
      YARDMASTER_ENCRYPTION_SALT: ${YARDMASTER_ENCRYPTION_SALT:?set YARDMASTER_ENCRYPTION_SALT}
    ports:
      - "${YARDMASTER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["worker", "--db", "postgres://yard:yard@postgres:5432/yard?sslmode=disable", "--name", "worker-1"]
    environment:
      YARDMASTER_ENCRYPTION_KEY: ${YARDMASTER_ENCRYPTION_KEY:?set YARDMASTER_ENCRYPTION_KEY}
      YARDMASTER_ENCRYPTION_SALT: ${YARDMASTER_ENCRYPTION_SALT:?set YARDMASTER_ENCRYPTION_SALT}
    depends_on:
      postgres:
        condition: service_healthy

  # A seeded, read-only demo on its own. Start it with: docker compose --profile demo up --build.
  demo:
    build: .
    profiles: ["demo"]
    command: ["demo", "--addr", ":8080"]
    ports:
      - "${YARDMASTER_PORT:-8080}:8080"

volumes:
  pgdata:
