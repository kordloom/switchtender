# Three deployments in one file, each behind its own profile so none drags another in.
#
#   The stack:       docker compose --profile stack up --build
#   The seeded demo: docker compose --profile demo up --build
#   Team:            docker compose --profile team up --build
#
# The stack is one server on SQLite, with its database and its signing key kept in a volume, which is
# everything Community runs. It used to be PostgreSQL, and creating a PostgreSQL schema is Team, so
# the documented command failed on every install without a license.
#
# The team profile is PostgreSQL, a server, and a worker. It needs a Team license, read from
# ./switchtender-license.json or the file SWITCHTENDER_LICENSE_FILE names, and SWITCHTENDER_AUDIT_KEY,
# because processes that share one database sign as one install and none of them mints the key.
#
# The encryption key and salt are read without a hard guard. Compose interpolates every service in the
# file no matter which profile is selected, so a required-variable guard on one profile refused to
# start the demo, which uses neither. Unset, the server says so on boot and runs with credentials
# disabled.
services:
  server:
    profiles: ["stack"]
    build: .
    command: ["serve", "--addr", ":8080", "--db", "/data/switchtender.db"]
    environment:
      SWITCHTENDER_ENCRYPTION_KEY: ${SWITCHTENDER_ENCRYPTION_KEY:-}
      SWITCHTENDER_ENCRYPTION_SALT: ${SWITCHTENDER_ENCRYPTION_SALT:-}
    volumes:
      - data:/data
    ports:
      - "${SWITCHTENDER_PORT:-8080}:8080"

  postgres:
    profiles: ["team"]
    image: postgres:16
    environment:
      POSTGRES_USER: switchtender
      POSTGRES_PASSWORD: switchtender
      POSTGRES_DB: switchtender
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "switchtender"]
      interval: 5s
      timeout: 5s
      retries: 10

  team-server:
    profiles: ["team"]
    build: .
    command: ["serve", "--addr", ":8080", "--db", "postgres://switchtender:switchtender@postgres:5432/switchtender?sslmode=disable"]
    environment: &team-env
      SWITCHTENDER_ENCRYPTION_KEY: ${SWITCHTENDER_ENCRYPTION_KEY:-}
      SWITCHTENDER_ENCRYPTION_SALT: ${SWITCHTENDER_ENCRYPTION_SALT:-}
      SWITCHTENDER_AUDIT_KEY: ${SWITCHTENDER_AUDIT_KEY:-}
    volumes: &team-license
      # A missing license file is refused rather than created. Left to its default, Compose makes an
      # empty directory where the file should be, and the server reads that as Community.
      - type: bind
        source: ${SWITCHTENDER_LICENSE_FILE:-./switchtender-license.json}
        target: /data/switchtender-license.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${SWITCHTENDER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["team"]
    build: .
    # The server creates the schema when it starts, so a worker that comes up first waits for it by
    # restarting rather than exiting for good.
    restart: on-failure
    command: ["worker", "--db", "postgres://switchtender:switchtender@postgres:5432/switchtender?sslmode=disable", "--name", "worker-1"]
    environment: *team-env
    volumes: *team-license
    depends_on:
      team-server:
        condition: service_started

  # A seeded, read-only demo on its own. Its own port variable, so the demo and the stack can run side
  # by side.
  demo:
    build: .
    profiles: ["demo"]
    command: ["demo", "--addr", ":8080"]
    ports:
      - "${SWITCHTENDER_DEMO_PORT:-8081}:8080"

volumes:
  data:
  pgdata:
