version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - misspell
    - whitespace
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - '.*\.pb\.go$'
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)_test\.go
        linters:
          - bodyclose
      # The spelling guard's table names every British form it hunts, so misspell finds twenty-four
      # of them in the one file whose job is to hold them. Excluding the guard is what lets the guard
      # exist; the words it lists are data, not prose this project wrote by mistake.
      - path: ^spelling_test\.go$
        linters:
          - misspell

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - '.*\.pb\.go$'
