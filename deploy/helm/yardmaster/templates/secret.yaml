{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yardmaster.secretName" . }}
  labels:
    {{- include "yardmaster.labels" . | nindent 4 }}
type: Opaque
stringData:
  YARDMASTER_ENCRYPTION_KEY: {{ required "encryptionKey or existingSecret is required" .Values.encryptionKey | quote }}
{{- end }}
