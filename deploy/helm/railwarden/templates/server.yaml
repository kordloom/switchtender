apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "railwarden.fullname" . }}-server
  labels:
    {{- include "railwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "railwarden.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "railwarden.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: {{ include "railwarden.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --addr
            - {{ .Values.server.addr | quote }}
            - --db
            - {{ .Values.database.dsn | quote }}
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: RAILWARDEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "railwarden.secretName" . }}
                  key: RAILWARDEN_ENCRYPTION_KEY
            - name: RAILWARDEN_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "railwarden.secretName" . }}
                  key: RAILWARDEN_ENCRYPTION_SALT
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "railwarden.fullname" . }}
  labels:
    {{- include "railwarden.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "railwarden.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
