{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "railwarden.secretName" . }}
  labels:
    {{- include "railwarden.labels" . | nindent 4 }}
type: Opaque
stringData:
  RAILWARDEN_ENCRYPTION_KEY: {{ required "encryptionKey or existingSecret is required" .Values.encryptionKey | quote }}
  RAILWARDEN_ENCRYPTION_SALT: {{ required "encryptionSalt or existingSecret is required" .Values.encryptionSalt | quote }}
{{- end }}
