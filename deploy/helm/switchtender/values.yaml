# Default values for the SwitchTender chart.

image:
  # repository is the published multi-arch image. A bare name here is not a shorthand for this
  # project: Kubernetes resolves "switchtender" to docker.io/library/switchtender, a Docker Hub
  # official-images name that belongs to nobody, so every pod went ImagePullBackOff while the real
  # image sat published on ghcr.
  repository: ghcr.io/kordloom/switchtender
  # tag defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

server:
  # replicas runs this many servers; they share the database and coordinate through it.
  replicas: 1
  # addr is the listen address inside the container.
  addr: ":8080"
  # extraArgs are appended to the serve command, for example ["--strict-grants"].
  extraArgs: []

worker:
  # enabled deploys dedicated workers alongside the server. Off by default, because a worker is
  # distributed execution, which is Team: without a licence the process refuses to start, so the
  # chart's own default produced a pod that crash-looped on a Community install. The server runs
  # everything itself, which is what Community is for. Turn this on with a licence set.
  enabled: false
  # replicas runs this many workers.
  replicas: 1
  # extraArgs are appended to the worker command, for example ["--queue", "dmz"].
  extraArgs: []

database:
  # dsn is the PostgreSQL connection string every server and worker shares. Empty runs the server
  # on its own SQLite file on the persistent volume below, which is the Community shape: one
  # server, no license, complete. Point it at PostgreSQL for multiple servers and dedicated
  # workers, and know that initializing a NEW PostgreSQL schema takes a Team license: the old
  # default here sent a Community install straight into that refusal on first boot, which read as
  # the chart being broken rather than as a tier boundary.
  #
  # UPGRADING from a chart older than 0.8.0: the default used to be a PostgreSQL DSN. If your
  # install relied on that default rather than setting its own, keep your values file explicit
  # about the dsn when you upgrade, or this default quietly reboots the server onto a fresh,
  # empty SQLite file while your data sits untouched in PostgreSQL.
  dsn: ""

persistence:
  # SQLite mode only: the volume the database file lives on. With a dsn set, no volume is created
  # and this block is ignored.
  enabled: true
  # size of the volume. Runs, events, facts history, and the audit chain all live here.
  size: 2Gi
  # storageClass, empty for the cluster default.
  storageClass: ""

# encryptionKey and encryptionSalt seal credentials at rest with argon2id and AES-256-GCM. Both are
# required; set them with --set encryptionKey=... --set encryptionSalt=... or point existingSecret
# at a Secret that holds SWITCHTENDER_ENCRYPTION_KEY and SWITCHTENDER_ENCRYPTION_SALT keys. The salt
# must stay stable across restarts or existing credentials cannot be decrypted.
encryptionKey: ""
encryptionSalt: ""
existingSecret: ""

# license is the signed license file a paid tier is turned on with, pasted whole. Leave it empty for
# Community, which needs no license and never expires. With existingSecret, put the same content
# under a license.jwt key in that secret instead. Without this the chart could install only
# Community, so the deployment the quickstart recommends had no way to apply a purchase.
license: ""

# auditKey is the producer signing seed, shared by every process in this install.
#
# A chart install shares one PostgreSQL database, and a shared-database install will not mint a
# signing key of its own: every process has to sign as the same install, and a key created inside one
# pod would be that pod's alone. So it has to be supplied, and until it was there was no way to. A
# chart install could not produce a receipt, a bundle, or a trust document, which is the entire
# feature the product is sold on, while the interface went on offering a Download receipt button.
#
# It is a 32 byte ed25519 seed written as hex: `openssl rand -hex 32`. Keep it somewhere you can
# restore from. Losing it does not invalidate the chain already written, but nothing signed
# afterward verifies against the old key, and a relying party who pinned that key has to be told.
# With existingSecret, put the same value under a SWITCHTENDER_AUDIT_KEY key in that secret.
auditKey: ""

service:
  type: ClusterIP
  port: 8080

resources: {}
