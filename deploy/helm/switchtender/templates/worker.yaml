{{- if .Values.worker.enabled }}
{{- if not .Values.database.dsn }}
{{- fail "Dedicated workers coordinate through a shared PostgreSQL database. Set database.dsn, or leave worker.enabled false and let the server run everything itself." }}
{{- end }}
{{- if and (not .Values.license) (not .Values.existingSecret) }}
{{- fail "Dedicated workers are distributed execution, which is Team: without a license the worker process refuses to start and the pod crash-loops. Set license, or point existingSecret at a Secret carrying license.jwt." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switchtender.fullname" . }}-worker
  labels:
    {{- include "switchtender.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "switchtender.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        # A change to a Secret the chart writes rolls the pods. They kept the old values until
        # something else restarted them, so a renewed license or a rotated key did nothing.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/db: {{ include (print $.Template.BasePath "/db-secret.yaml") . | sha256sum }}
      labels:
        {{- include "switchtender.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: {{ include "switchtender.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - worker
            - --name
            - $(POD_NAME)
            {{- range .Values.worker.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SWITCHTENDER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.secretName" . }}
                  key: SWITCHTENDER_ENCRYPTION_KEY
            - name: SWITCHTENDER_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.secretName" . }}
                  key: SWITCHTENDER_ENCRYPTION_SALT
            {{- if or .Values.auditKey .Values.existingSecret }}
            # Every process in a shared-database install signs as the same install, so they all read
            # the same seed. Without it this deployment cannot sign a receipt at all.
            - name: SWITCHTENDER_AUDIT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.secretName" . }}
                  key: SWITCHTENDER_AUDIT_KEY
                  optional: true
            {{- end }}
            {{- if or .Values.license .Values.existingSecret }}
            # A worker is distributed execution, which is Team, so it refuses to start without a
            # license. The chart deployed one regardless and had no way to supply one, which is a
            # pod that can never come up.
            - name: SWITCHTENDER_LICENSE
              value: /etc/switchtender/license/license.jwt
            {{- end }}
            {{- if .Values.database.dsn }}
            # The DSN carries its password, so it is read from a Secret rather than passed as an
            # argument, where the pod spec showed it to anyone allowed to list pods.
            - name: SWITCHTENDER_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.fullname" . }}-db
                  key: SWITCHTENDER_DB
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.license .Values.existingSecret .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if or .Values.license .Values.existingSecret }}
            - name: license
              mountPath: /etc/switchtender/license
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.license .Values.existingSecret .Values.extraVolumes }}
      volumes:
        {{- if or .Values.license .Values.existingSecret }}
        - name: license
          secret:
            secretName: {{ include "switchtender.secretName" . }}
            items:
              - key: license.jwt
                path: license.jwt
            optional: true
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
