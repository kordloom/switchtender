{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switchtender.fullname" . }}-worker
  labels:
    {{- include "switchtender.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "switchtender.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "switchtender.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: {{ include "switchtender.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - worker
            - --db
            - {{ .Values.database.dsn | quote }}
            - --name
            - $(POD_NAME)
            {{- range .Values.worker.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SWITCHTENDER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.secretName" . }}
                  key: SWITCHTENDER_ENCRYPTION_KEY
            - name: SWITCHTENDER_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.secretName" . }}
                  key: SWITCHTENDER_ENCRYPTION_SALT
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
