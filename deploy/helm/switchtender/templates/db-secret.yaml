{{- if .Values.database.dsn }}
# The DSN carries its password, so the processes read it from this Secret rather than taking it as an
# argument, where the pod spec showed it to anyone allowed to list pods.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "switchtender.fullname" . }}-db
  labels:
    {{- include "switchtender.labels" . | nindent 4 }}
type: Opaque
stringData:
  SWITCHTENDER_DB: {{ .Values.database.dsn | quote }}
{{- end }}
