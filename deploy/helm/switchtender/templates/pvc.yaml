{{- if and (not .Values.database.dsn) .Values.persistence.enabled }}
# SQLite mode keeps the whole install in one file: runs, events, facts history, and the audit
# chain. Losing the pod must not lose that, so the file lives on a claim rather than in the
# container. Postgres mode creates nothing here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "switchtender.fullname" . }}-data
  labels:
    {{- include "switchtender.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
