{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "switchtender.secretName" . }}
  # The encryption key, the signing seed, and the license live here, and without the key and salt no
  # stored credential decrypts. The Secret was deleted by an uninstall, and by switching to
  # existingSecret, which took the seed and the license with it, so it is kept.
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "switchtender.labels" . | nindent 4 }}
type: Opaque
stringData:
  SWITCHTENDER_ENCRYPTION_KEY: {{ required "encryptionKey or existingSecret is required" .Values.encryptionKey | quote }}
  SWITCHTENDER_ENCRYPTION_SALT: {{ required "encryptionSalt or existingSecret is required" .Values.encryptionSalt | quote }}
  {{- if .Values.license }}
  license.jwt: {{ .Values.license | quote }}
  {{- end }}
  {{- if .Values.auditKey }}
  SWITCHTENDER_AUDIT_KEY: {{ .Values.auditKey | quote }}
  {{- end }}
{{- end }}
