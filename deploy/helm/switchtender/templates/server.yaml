{{- if and .Values.database.dsn (not .Values.auditKey) (not .Values.existingSecret) }}
{{- fail "A PostgreSQL install signs its audit chain with one shared identity, and this one has none: every receipt it should produce would answer 404. Set auditKey to a hex seed (openssl rand -hex 32), or point existingSecret at a Secret carrying SWITCHTENDER_AUDIT_KEY." }}
{{- end }}
{{- if and (not .Values.database.dsn) (gt (int .Values.server.replicas) 1) }}
{{- fail "SQLite mode (empty database.dsn) runs exactly one server: two replicas sharing one file corrupt it. Set database.dsn to PostgreSQL for more than one." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switchtender.fullname" . }}-server
  labels:
    {{- include "switchtender.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  {{- if not .Values.database.dsn }}
  # SQLite holds one writer. A rolling update briefly runs two pods against the same file on the
  # same volume, so the update strategy has to stop the old server before the new one opens it.
  # rollingUpdate is nulled explicitly: on an upgrade from a RollingUpdate deployment the old
  # parameters otherwise survive the strategic merge, and the API refuses Recreate alongside them,
  # which failed the exact helm upgrade this stanza exists to make safe.
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "switchtender.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "switchtender.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- if not .Values.database.dsn }}
      # The image runs as uid 10001, and a freshly provisioned volume is owned by root. fsGroup is
      # what makes the mounted /data writable without an init container doing a chown.
      securityContext:
        fsGroup: 10001
      {{- end }}
      containers:
        - name: server
          image: {{ include "switchtender.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --addr
            - {{ .Values.server.addr | quote }}
            - --db
            - {{ .Values.database.dsn | default "/data/switchtender.db" | quote }}
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: SWITCHTENDER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.secretName" . }}
                  key: SWITCHTENDER_ENCRYPTION_KEY
            - name: SWITCHTENDER_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.secretName" . }}
                  key: SWITCHTENDER_ENCRYPTION_SALT
            {{- if or .Values.auditKey .Values.existingSecret }}
            # Every process in a shared-database install signs as the same install, so they all read
            # the same seed. Without it this deployment cannot sign a receipt at all.
            - name: SWITCHTENDER_AUDIT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchtender.secretName" . }}
                  key: SWITCHTENDER_AUDIT_KEY
                  optional: true
            {{- end }}
            {{- if or .Values.license .Values.existingSecret }}
            # A paid license is a signed file the binary reads from this path. Without it the chart
            # could install only Community, so the deployment the quickstart recommends had no way
            # to apply a Team purchase at all.
            - name: SWITCHTENDER_LICENSE
              value: /etc/switchtender/license/license.jwt
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness asks whether this pod can serve, which is what decides if it stays in the
          # Service's endpoints. /healthz answers as long as the process is up, so a pod whose
          # database had become unreachable kept taking traffic and answering 5xx forever. /readyz
          # reads the run store and fails closed, which is the question a readiness probe asks.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.license .Values.existingSecret (not .Values.database.dsn) }}
          volumeMounts:
            {{- if not .Values.database.dsn }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if or .Values.license .Values.existingSecret }}
            - name: license
              mountPath: /etc/switchtender/license
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.license .Values.existingSecret (not .Values.database.dsn) }}
      volumes:
        {{- if not .Values.database.dsn }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "switchtender.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if or .Values.license .Values.existingSecret }}
        - name: license
          secret:
            secretName: {{ include "switchtender.secretName" . }}
            items:
              - key: license.jwt
                path: license.jwt
            optional: true
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "switchtender.fullname" . }}
  labels:
    {{- include "switchtender.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "switchtender.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
