# GoReleaser configuration for SwitchTender.
# Standard artifacts (binaries, archives, checksums, signatures, SBOMs, Homebrew, Linux packages)
# are declared here. The bespoke macOS .app/.dmg desktop bundle, notarization, and Windows
# Authenticode signing live in the release workflow because they need credentials, not tooling.
# Validate locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

project_name: switchtender

before:
  hooks:
    - go mod download

builds:
  - id: switchtender
    main: .
    binary: switchtender
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kordloom/switchtender/cmd.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

# Merge the two macOS builds into one universal binary, so a Mac user downloads a single file.
universal_binaries:
  - id: switchtender
    replace: true
    name_template: switchtender

archives:
  - id: switchtender
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# The keyless cosign signature over SHA256SUMS is made by the workflow, not here. The workflow
# appends the dmg and BINARY_SHA256SUMS lines to that file after this runs, so a signature made at
# this point covers a document that no longer exists by the time anyone downloads it. Signing here
# and again there also meant two different signed SHA256SUMS existed for one tag, with the second
# overwriting the first on a live release. There is one signature now, over the finished file.

sboms:
  - id: archives
    artifacts: archive

# Homebrew cask, rendered here and pushed to kordloom/homebrew-tap by the workflow's final step,
# after the release is public. Pushing from here twice cost a release: it ran inside the publish
# phase, so a tap token problem, a 403 first and a stale token before that, failed the whole
# release after every archive was already uploaded. The upload is always skipped now; the rendered
# cask lands in dist for the workflow to push once nothing can be sunk by it.
homebrew_casks:
  - name: switchtender
    skip_upload: true
    repository:
      owner: kordloom
      name: homebrew-tap
      # Unused while skip_upload is true, but the template must still resolve, so the workflow
      # defines the env var empty. The token field's template context has no helper functions, so
      # plain .Env is the only portable form.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://switchtender.com"
    description: "Run everything, watch every host, prove every change: one binary control plane for Ansible, Terraform, OpenTofu, Bash, PowerShell, Python, and Go."

# Linux packages: deb, rpm, and apk built with nfpm. No secrets required.
nfpms:
  - id: packages
    package_name: switchtender
    maintainer: "SwitchTender <noreply@switchtender.com>"
    homepage: "https://switchtender.com"
    description: "Run everything, watch every host, prove every change: one binary control plane for Ansible, Terraform, OpenTofu, Bash, PowerShell, Python, and Go."
    license: "BUSL-1.1"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: kordloom
    name: switchtender
  prerelease: auto
  # Assembled as a draft and promoted by the workflow's last step. Publishing here instead put the
  # release in front of users while three artifact-producing steps still had to run, so any failure
  # in that tail landed on something already public and irreversible rather than on a draft. That is
  # what shipped v1.69.0 without its dmg, without provenance, and without BINARY_SHA256SUMS, which
  # is the manifest `switchtender version --verify` reads. The last thing that happens to a release
  # is now that people can see it.
  draft: true

report_sizes: true
