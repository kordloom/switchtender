# GoReleaser configuration for SwitchTender.
# Standard artifacts (binaries, archives, checksums, signatures, SBOMs, Homebrew, Linux packages)
# are declared here. The bespoke macOS .app/.dmg desktop bundle, notarization, and Windows
# Authenticode signing live in the release workflow because they need credentials, not tooling.
# Validate locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

project_name: switchtender

before:
  hooks:
    - go mod download

builds:
  - id: switchtender
    main: .
    binary: switchtender
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kordloom/switchtender/cmd.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

# Merge the two macOS builds into one universal binary, so a Mac user downloads a single file.
universal_binaries:
  - id: switchtender
    replace: true
    name_template: switchtender

# Sign the macOS binary with the Developer ID certificate and notarize it, so a quarantined
# download or a Homebrew cask install runs instead of Gatekeeper refusing an unidentified
# developer. It sits before the archives, so the archive, SHA256SUMS, and the BINARY_SHA256SUMS
# manifest built after this all describe the signed binary. It switches on only when the
# certificate is present and non-empty, since a missing Actions secret arrives as an empty
# string, which keeps forks and local snapshots building unsigned.
notarize:
  macos:
    - enabled: '{{ ne (index .Env "MACOS_SIGN_P12") "" }}'
      ids: [switchtender]
      sign:
        certificate: '{{ index .Env "MACOS_SIGN_P12" }}'
        password: '{{ index .Env "MACOS_SIGN_PASSWORD" }}'
      notarize:
        issuer_id: '{{ index .Env "MACOS_NOTARY_ISSUER_ID" }}'
        key_id: '{{ index .Env "MACOS_NOTARY_KEY_ID" }}'
        key: '{{ index .Env "MACOS_NOTARY_KEY" }}'
        wait: true
        timeout: 20m

archives:
  - id: switchtender
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Every entry is recorded as owned by root. Left alone, an archive records the build account's
    # uid, and tar run as root restores it, so a binary unpacked into a root-owned directory stayed
    # writable by whichever local account happened to share that uid.
    builds_info:
      owner: root
      group: root
      mode: 0755
    files:
      - src: LICENSE
        info: &rootfile
          owner: root
          group: root
          mode: 0644
      # Beside LICENSE, because it changes one of its parameters for the versions released before
      # LICENSE carried the two-year wording. Somebody auditing an archive offline reads what is in
      # their hand, so the grant travels with the artifact rather than living only in a repository
      # they would have to know to go and find.
      - src: LICENSE-GRANT.md
        info: *rootfile
      - src: README.md
        info: *rootfile

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# The keyless cosign signature over SHA256SUMS is made by the workflow, not here. The workflow
# appends the dmg and BINARY_SHA256SUMS lines to that file after this runs, so a signature made at
# this point covers a document that no longer exists by the time anyone downloads it. Signing here
# and again there also meant two different signed SHA256SUMS existed for one tag, with the second
# overwriting the first on a live release. There is one signature now, over the finished file.

sboms:
  - id: archives
    artifacts: archive

# Homebrew cask, rendered here and pushed to kordloom/homebrew-tap by the workflow's final step,
# after the release is public. Pushing from here twice cost a release: it ran inside the publish
# phase, so a tap token problem, a 403 first and a stale token before that, failed the whole
# release after every archive was already uploaded. The upload is always skipped now; the rendered
# cask lands in dist for the workflow to push once nothing can be sunk by it.
homebrew_casks:
  - name: switchtender
    skip_upload: true
    repository:
      owner: kordloom
      name: homebrew-tap
      # Unused while skip_upload is true, but the template must still resolve, so the workflow
      # defines the env var empty. The token field's template context has no helper functions, so
      # plain .Env is the only portable form.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://switchtender.com"
    description: "One gate for every change to production, including the ones AI agents make"

# Linux packages: deb, rpm, and apk built with nfpm. No secrets required.
nfpms:
  - id: packages
    package_name: switchtender
    maintainer: "SwitchTender <noreply@switchtender.com>"
    homepage: "https://switchtender.com"
    description: "One control point for every way your infrastructure can change: Ansible, Terraform, OpenTofu, Bash, PowerShell, Python, and Go behind one identity, policy, approval, and evidence trail."
    license: "BUSL-1.1"
    formats:
      - deb
      - rpm
      - apk
    # Bash runs every script template and the starter templates, and an Alpine host has none until
    # it is installed. The CA bundle is what version --verify and every HTTPS call check against,
    # and a minimal image ships without it.
    dependencies:
      - bash
      - ca-certificates
    bindir: /usr/bin

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: kordloom
    name: switchtender
  prerelease: auto
  # Assembled as a draft and promoted by the workflow's last step. Publishing here instead put the
  # release in front of users while three artifact-producing steps still had to run, so any failure
  # in that tail landed on something already public and irreversible rather than on a draft. That is
  # what shipped v1.69.0 without its dmg, without provenance, and without BINARY_SHA256SUMS, which
  # is the manifest `switchtender version --verify` reads. The last thing that happens to a release
  # is now that people can see it.
  draft: true

report_sizes: true
