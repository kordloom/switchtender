# GoReleaser configuration for SwitchTender.
# Standard artifacts (binaries, archives, checksums, signatures, SBOMs, Homebrew, Linux packages)
# are declared here. The bespoke macOS .app/.dmg desktop bundle, notarization, and Windows
# Authenticode signing live in the release workflow because they need credentials, not tooling.
# Validate locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

project_name: switchtender

before:
  hooks:
    - go mod download

builds:
  - id: switchtender
    main: .
    binary: switchtender
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kordloom/switchtender/cmd.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

# Merge the two macOS builds into one universal binary, so a Mac user downloads a single file.
universal_binaries:
  - id: switchtender
    replace: true
    name_template: switchtender

archives:
  - id: switchtender
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# Keyless cosign signature over the checksums, matching the current release. The workflow supplies
# the ambient OIDC token, so no key material is stored.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

sboms:
  - id: archives
    artifacts: archive

# Homebrew cask, pushed to kordloom/homebrew-tap. It skips the push until the tap token secret
# exists, so a release never fails just because the tap is not set up yet.
homebrew_casks:
  - name: switchtender
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: kordloom
      name: homebrew-tap
      # The workflow always defines this env var, empty when the secret is unset, in which case
      # skip_upload already stops the publish. The token field's template context has no helper
      # functions, so plain .Env is the only portable form.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://switchtender.com"
    description: "Run everything, watch every host, prove every change: one binary control plane for Ansible, Terraform, OpenTofu, Bash, PowerShell, Python, and Go."

# Linux packages: deb, rpm, and apk built with nfpm. No secrets required.
nfpms:
  - id: packages
    package_name: switchtender
    maintainer: "SwitchTender <noreply@switchtender.com>"
    homepage: "https://switchtender.com"
    description: "Run everything, watch every host, prove every change: one binary control plane for Ansible, Terraform, OpenTofu, Bash, PowerShell, Python, and Go."
    license: "BUSL-1.1"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: kordloom
    name: switchtender
  prerelease: auto
  # The desktop .dmg is built and attached by the release workflow after this runs.

report_sizes: true
