name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # A tag published whatever it pointed at. CI runs on pushes to main and on pull requests, so a tag
  # placed on an unmerged commit, or on main while it was red, went straight to a signed release with
  # nothing having checked it. This runs the suite once against the exact commit being released, and
  # everything else waits on it.
  #
  # The suite here must actually be the suite. Without a database the PostgreSQL contract skips, and
  # without a loomseal checkout the cross-verification against the reference verifier skips, so the
  # gate was green while the two proofs a release rests on never ran. Both dependencies are provided
  # here, and SWITCHTENDER_REQUIRE_FULL_SUITE turns their skips into failures so the gate cannot
  # quietly regress into the smaller suite again.
  #
  # This is also the one job in the workflow that executes the repository's own test code, so it
  # gets none of the workflow's write grants: no id-token that could mint a Fulcio certificate
  # identical to a genuine release signature, no persisted contents token in .git/config.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: switchtender
          POSTGRES_PASSWORD: switchtender
          POSTGRES_DB: switchtender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchtender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SWITCHTENDER_TEST_POSTGRES_DSN: postgres://switchtender:switchtender@localhost:5432/switchtender?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check out the loomseal version this module depends on
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/kordloom/loomseal)"
          echo "cross-checking against loomseal $version"
          git clone --quiet https://github.com/kordloom/loomseal.git "$RUNNER_TEMP/loomseal"
          git -C "$RUNNER_TEMP/loomseal" checkout --quiet "$version"
          echo "SWITCHTENDER_LOOMSEAL_REPO=$RUNNER_TEMP/loomseal" >> "$GITHUB_ENV"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          SWITCHTENDER_REQUIRE_FULL_SUITE: "1"
        run: go test -race ./...

  # The release job assembles everything as a draft and publishes at the very end. It used to
  # publish in the middle: GoReleaser flipped the release public the moment its own uploads
  # finished, while the dmg, BINARY_SHA256SUMS, and the provenance attestation were still to come,
  # so any failure in that tail landed on a release users could already see. v1.69.0 shipped
  # without all three because the very last thing GoReleaser did, a Homebrew cask push, answered
  # 403. Now every failure before the final step leaves an unpublished draft that a human can
  # inspect, repair, or delete, with nothing public and wrong.
  #
  # The tag guard makes workflow_dispatch on a branch a no-op for this job. Without it, a dispatch
  # from main ran the whole job with the tag-gated steps silently skipped and reported success: a
  # published release with no dmg, no manifest, and no attestation, from a button press. To re-run
  # a release, dispatch against the tag ref itself.
  release:
    needs: gate
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # The certificate is examined in a step whose env is the only place it appears, rather than
      # sitting in job-wide env where every later step, GoReleaser and its plugins included, could
      # read it.
      - name: Probe for the Apple signing certificate
        id: apple
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "${MACOS_CERTIFICATE:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      # Import the Apple Developer ID certificate only when it is configured, so releases keep
      # working before notarization is set up and gain it automatically once the secret exists.
      - name: Import the Apple Developer ID certificate
        if: steps.apple.outputs.have == 'true'
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      # Standard artifacts: cross-compiled binaries, a universal macOS binary, archives, SHA256SUMS,
      # SBOMs, and deb/rpm/apk packages, assembled onto a draft release. The checksums signature is
      # made later in this job, after the dmg and BINARY_SHA256SUMS lines are appended, so exactly
      # one signature is ever published and it covers the finished file. The cask is rendered here
      # but pushed after publication. The token env var must exist for the cask template to resolve;
      # it is deliberately empty.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          # Pinned exactly so a goreleaser release cannot change our pipeline under us. Bump
          # deliberately.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ""

      # BINARY_SHA256SUMS names the hash of the binary inside each archive, which is what
      # `switchtender version --verify` holds the running executable against. SHA256SUMS covers the
      # archives; this covers the file that actually runs. It is built here, straight after the
      # archives exist and before any macOS packaging, because it used to be manufactured at the
      # tail of the dmg step: an icon rendering failure, an hdiutil error, or a notary stall could
      # withhold the one cheap artifact that makes every published binary self-verifiable.
      - name: Build the binary manifest
        id: manifest
        run: |
          set -euo pipefail
          : > dist/BINARY_SHA256SUMS
          for archive in dist/switchtender_*.tar.gz; do
            [ -e "$archive" ] || continue
            name="$(basename "$archive" .tar.gz)"
            tar -xzf "$archive" -C dist switchtender
            hash="$(shasum -a 256 dist/switchtender | cut -d' ' -f1)"
            printf '%s  %s\n' "$hash" "$name" >> dist/BINARY_SHA256SUMS
            rm -f dist/switchtender
          done
          for archive in dist/switchtender_*windows*.zip; do
            [ -e "$archive" ] || continue
            name="$(basename "$archive" .zip)"
            unzip -o -q "$archive" switchtender.exe -d dist
            hash="$(shasum -a 256 dist/switchtender.exe | cut -d' ' -f1)"
            printf '%s  %s.exe\n' "$hash" "$name" >> dist/BINARY_SHA256SUMS
            rm -f dist/switchtender.exe
          done
          # A manifest with no entries is worse than a missing one: it verifies nothing while
          # looking like the thing the binary checks itself against.
          [ -s dist/BINARY_SHA256SUMS ]
          cat dist/BINARY_SHA256SUMS

      # The desktop app is the one bespoke artifact: a double-clickable macOS bundle whose launcher
      # runs `switchtender desktop`. It is ad-hoc signed unless MACOS_SIGN_IDENTITY is set, in which
      # case it is Developer ID signed and, when notary credentials are present, notarized and
      # stapled. It may fail without sinking the release: the manifest and signature are complete
      # without it, and the promote step publishes a release that verifies. What a failure here
      # costs is the dmg alone.
      - name: Build and attach the desktop app and dmg
        id: dmg
        continue-on-error: true
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}

          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/kordloom/switchtender/cmd.Version=$VERSION" \
              -o "dist/desktop_$arch" .
          done
          lipo -create -output dist/desktop_universal dist/desktop_arm64 dist/desktop_amd64

          mkdir dist/switchtender.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size site/assets/favicon.png \
              --out "dist/switchtender.iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128 256; do
            double=$((size * 2))
            sips -z $double $double site/assets/favicon.png \
              --out "dist/switchtender.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns dist/switchtender.iconset -o dist/switchtender.icns

          APP=dist/SwitchTender.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/desktop_universal "$APP/Contents/MacOS/switchtender"
          cp dist/switchtender.icns "$APP/Contents/Resources/switchtender.icns"
          printf '#!/bin/sh\nexec "$(dirname "$0")/switchtender" desktop\n' > "$APP/Contents/MacOS/launch"
          chmod +x "$APP/Contents/MacOS/launch" "$APP/Contents/MacOS/switchtender"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>SwitchTender</string>
            <key>CFBundleDisplayName</key><string>SwitchTender</string>
            <key>CFBundleIdentifier</key><string>dev.switchtender.desktop</string>
            <key>CFBundleExecutable</key><string>launch</string>
            <key>CFBundleIconFile</key><string>switchtender</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST

          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --verbose=1 "$APP"

          # codesign rewrites the binary, so the app can never hash like the archive it came from.
          # Without its own manifest entry, `switchtender version --verify` inside the shipped app
          # called the official artifact "not the released binary".
          hash="$(shasum -a 256 "$APP/Contents/MacOS/switchtender" | cut -d' ' -f1)"
          printf '%s  switchtender_%s_darwin_app\n' "$hash" "$VERSION" >> dist/BINARY_SHA256SUMS

          # The disk is not the constraint and never was: the run that failed this step had
          # 95 GiB free, and clearing the Go caches here only looked like a fix because the next
          # release happened to pass. hdiutil sizes an image from its source folder, under-sizes
          # it, and then fails mid-copy with ENOSPC while the volume it just made fills up. The
          # size is therefore stated outright with room to spare, and because UDZO compresses the
          # result, the slack costs nothing in the shipped artifact. A stale mount from an earlier
          # attempt is detached first so -ov cannot trip over it. df stays as the line that
          # settled which resource was actually short.
          df -h /
          mkdir dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil detach /Volumes/SwitchTender -force 2>/dev/null || true
          staged=$(du -sm dist/dmg | cut -f1)
          hdiutil create -volname SwitchTender -srcfolder dist/dmg -ov -format UDZO -fs HFS+ \
            -size "$(( staged * 2 + 300 ))m" "dist/SwitchTender_${VERSION}.dmg"

          # Notarization needs the full credential set; a partial one used to reach notarytool and
          # fail there. The timeout keeps an Apple notary outage from holding the job to the
          # six-hour limit.
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ] && [ -n "${NOTARY_KEY_P8:-}" ] \
            && [ -n "${NOTARY_KEY_ID:-}" ] && [ -n "${NOTARY_ISSUER_ID:-}" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > dist/notary_key.p8
            xcrun notarytool submit "dist/SwitchTender_${VERSION}.dmg" \
              --key dist/notary_key.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m
            xcrun stapler staple "dist/SwitchTender_${VERSION}.dmg"
            rm -f dist/notary_key.p8
          fi

      # The one signature over the finished checksums. BINARY_SHA256SUMS and the dmg are folded
      # into SHA256SUMS before signing, so the signature covers them: the manifest was once
      # uploaded outside the signature while `switchtender version --verify` treated it as
      # authoritative, which left the binary self-check resting on nothing but TLS to GitHub.
      # Nothing may be appended to SHA256SUMS after this step.
      #
      # This runs under !cancelled() so a GoReleaser failure after its uploads still gets a
      # complete, signed draft a human can inspect and publish by hand; the promote step below
      # still refuses on any failure. The names are hashed from inside dist so they match
      # goreleaser's, which are bare: a "dist/" prefix would land in the published file and make
      # `shasum -c SHA256SUMS` fail for anyone checking a download directory.
      # The source escrow layer of docs/continuity.md: every release carries its own exact
      # source as an asset inside the signed manifest, so keeping a release keeps its source
      # even if the repository or the account hosting it goes away.
      - name: Pack the source tree
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          git archive --format=tar.gz --prefix "switchtender-${VERSION}/" \
            -o "dist/switchtender_${VERSION}_source.tar.gz" "$GITHUB_REF_NAME"

      - name: Sign and attach the checksums manifest
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          (
            cd dist
            if [ -f "SwitchTender_${VERSION}.dmg" ]; then
              shasum -a 256 "SwitchTender_${VERSION}.dmg" >> SHA256SUMS
            fi
            shasum -a 256 BINARY_SHA256SUMS >> SHA256SUMS
            if [ -f "switchtender_${VERSION}_source.tar.gz" ]; then
              shasum -a 256 "switchtender_${VERSION}_source.tar.gz" >> SHA256SUMS
            fi
          )
          grep -q '  BINARY_SHA256SUMS$' dist/SHA256SUMS
          for i in 1 2 3; do
            if cosign sign-blob --yes dist/SHA256SUMS \
                --output-signature dist/SHA256SUMS.sig \
                --output-certificate dist/SHA256SUMS.pem; then
              break
            fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 15
          done
          assets="dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem dist/BINARY_SHA256SUMS"
          if [ -f "dist/switchtender_${VERSION}_source.tar.gz" ]; then
            assets="$assets dist/switchtender_${VERSION}_source.tar.gz"
          fi
          if [ -f "dist/SwitchTender_${VERSION}.dmg" ]; then
            assets="$assets dist/SwitchTender_${VERSION}.dmg"
          fi
          # shellcheck disable=SC2086
          gh release upload "$GITHUB_REF_NAME" $assets --clobber

      # SLSA build provenance for every published artifact, verifiable with `gh attestation
      # verify`. GitHub only persists attestations for public or paid repositories, so these steps
      # are allowed to fail without failing the release. The dmg is attested separately because its
      # glob matches nothing when the dmg step failed, which would have taken the archives'
      # provenance down with it.
      - name: Attest build provenance
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk

      - name: Attest the desktop dmg
        if: ${{ !cancelled() && steps.dmg.outcome == 'success' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/SwitchTender_*.dmg

      # Publication is the last irreversible act. This step runs only when everything above it that
      # is allowed to fail the job has succeeded, so a failure anywhere in the tail leaves a draft
      # instead of a public release missing the pieces that make it verifiable.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      # The cask goes to the tap only after the release is public, so its download URL resolves the
      # moment it lands, and a tap failure costs the cask alone, never the release. The step judges
      # the token by attempting the push, not by probing beforehand: a fine-grained token that
      # cannot write still shows push=true on the repository object, because that field reflects
      # the owner's rights rather than the token's grants, so the old probe blessed a token the
      # push then refused. A failure surfaces as a warning annotation instead of sinking anything.
      - name: Publish the Homebrew cask
        continue-on-error: true
        env:
          # Either secret name works, newest-set first: the token was pasted under both names while
          # it was being fixed, and a release should not fail its cask over which one stuck.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' && secrets.HOMEBREW_TAP_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "cask skipped: no tap token secret is set"
            exit 0
          fi
          cask="$(find dist -name 'switchtender.rb' -print -quit)"
          if [ -z "$cask" ]; then
            echo "::warning title=Homebrew cask not published::goreleaser rendered no cask file"
            exit 0
          fi
          sha="$(GH_TOKEN="$TAP_TOKEN" gh api \
            repos/kordloom/homebrew-tap/contents/Casks/switchtender.rb -q .sha 2>/dev/null || true)"
          args=(--method PUT repos/kordloom/homebrew-tap/contents/Casks/switchtender.rb
            -f message="Update switchtender to ${GITHUB_REF_NAME}"
            -f content="$(base64 -i "$cask" | tr -d '\n')")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          if ! GH_TOKEN="$TAP_TOKEN" gh api "${args[@]}" > /dev/null; then
            echo "::warning title=Homebrew cask not published::the tap push was refused; give HOMEBREW_TAP_GITHUB_TOKEN Contents read and write on kordloom/homebrew-tap"
            exit 0
          fi
          echo "cask updated on kordloom/homebrew-tap"

  # Multi-arch container images on ghcr.io. A separate Linux job because the release job runs on
  # macOS for the desktop bundle, and Docker is unavailable there.
  docker:
    needs: gate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing and provenance both mint an ambient OIDC token; without this the signature
      # step fails and the images publish unsigned again.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest moves only when this tag is the newest final release, decided against the tag list
      # rather than by tag shape. Shape alone meant re-running an old tag, or tagging a backport,
      # repointed latest backwards for everyone pulling the image.
      - name: Decide whether this tag moves latest
        id: newest
        run: |
          set -uo pipefail
          # The checkout is depth 1 with no tags, so the list has to be fetched. An explicit refspec
          # is used rather than --tags, whose behavior on a shallow clone is not worth depending on:
          # it started returning nothing after a runner git upgrade, and because the result was piped
          # straight into grep, an empty list failed the step and took the whole image publish with
          # it. Deciding a boolean must never be able to do that.
          git fetch --quiet --force origin 'refs/tags/*:refs/tags/*' \
            || echo "could not refresh the tag list"
          top="$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | sed -n '1p')"
          echo "this tag: $GITHUB_REF_NAME, newest final tag seen: ${top:-none}"
          if [ -n "$top" ] && [ "$GITHUB_REF_NAME" = "$top" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            # Leaving latest where it is, is the safe answer to both "this is an older tag" and "the
            # tag list could not be read." Moving it wrongly points every plain docker pull at the
            # wrong build.
            echo "not moving latest: ${top:-the tag list could not be read}"
          fi

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/kordloom/switchtender
          # latest=false turns off the flavor's own automatic latest, which ignores the enable
          # condition on the raw tag below and would reapply latest to any semver tag.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.newest.outputs.move }}
          # GitHub cannot classify the Business Source License, so the action's derived label says
          # NOASSERTION and every published image looked unlicensed to anything reading its metadata.
          labels: |
            org.opencontainers.image.licenses=BUSL-1.1

      - name: Build and push the images
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The binaries carry a keyless cosign signature and SLSA provenance; the images carried
      # neither, so somebody pulling ghcr.io/kordloom/switchtender had nothing to check while
      # somebody downloading the tarball had two things. Both are signed by digest rather than tag,
      # because a tag can be moved and a digest cannot.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/kordloom/switchtender@${DIGEST}"

      - name: Attest the image build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/kordloom/switchtender
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
