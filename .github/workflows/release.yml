name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set the version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross-compile every target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/railwarden_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/dcadolph/railwarden/cmd.Version=$VERSION" \
              -o "$out" .
          done

      - name: Build the universal macOS app and dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          lipo -create -output dist/railwarden_darwin_universal \
            dist/railwarden_darwin_arm64 dist/railwarden_darwin_amd64

          mkdir dist/railwarden.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size site/assets/favicon.png \
              --out "dist/railwarden.iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128 256; do
            double=$((size * 2))
            sips -z $double $double site/assets/favicon.png \
              --out "dist/railwarden.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns dist/railwarden.iconset -o dist/railwarden.icns

          APP=dist/Railwarden.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/railwarden_darwin_universal "$APP/Contents/MacOS/railwarden"
          cp dist/railwarden.icns "$APP/Contents/Resources/railwarden.icns"
          printf '#!/bin/sh\nexec "$(dirname "$0")/railwarden" desktop\n' > "$APP/Contents/MacOS/launch"
          chmod +x "$APP/Contents/MacOS/launch" "$APP/Contents/MacOS/railwarden"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Railwarden</string>
            <key>CFBundleDisplayName</key><string>Railwarden</string>
            <key>CFBundleIdentifier</key><string>dev.railwarden.desktop</string>
            <key>CFBundleExecutable</key><string>launch</string>
            <key>CFBundleIconFile</key><string>railwarden</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=1 "$APP"

          mkdir dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Railwarden -srcfolder dist/dmg -ov -format UDZO \
            "dist/Railwarden_${VERSION}.dmg"

      - name: Smoke test the app binary
        run: |
          FAKEHOME=$(mktemp -d)
          HOME="$FAKEHOME" RAILWARDEN_DESKTOP_NO_BROWSER=1 \
            dist/Railwarden.app/Contents/MacOS/launch > desktop.log 2>&1 &
          PID=$!
          sleep 3
          PORT=$(cat "$FAKEHOME/Library/Application Support/Railwarden/port" 2>/dev/null) \
            || { echo "no port file written; the app did not start"; cat desktop.log; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$PORT/healthz")
          kill $PID || true
          echo "healthz: $CODE"
          [ "$CODE" = "200" ] || { cat desktop.log; exit 1; }

      - name: Package the archives and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          for target in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
            mkdir "pack_$target"
            cp "railwarden_$target" "pack_$target/railwarden"
            tar -czf "railwarden_${VERSION}_${target}.tar.gz" -C "pack_$target" railwarden
          done
          mkdir pack_windows
          cp railwarden_windows_amd64.exe pack_windows/railwarden.exe
          (cd pack_windows && zip -q "../railwarden_${VERSION}_windows_amd64.zip" railwarden.exe)
          shasum -a 256 railwarden_${VERSION}_*.tar.gz railwarden_${VERSION}_*.zip \
            "Railwarden_${VERSION}.dmg" > SHA256SUMS

      - name: Attach the artifacts to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/railwarden_${VERSION}_*.tar.gz \
            dist/railwarden_${VERSION}_*.zip \
            "dist/Railwarden_${VERSION}.dmg" \
            dist/SHA256SUMS \
            --clobber

      - name: Upload the dry-run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: railwarden-dry-run
          path: |
            dist/railwarden_*_*.tar.gz
            dist/railwarden_*_*.zip
            dist/Railwarden_*.dmg
            dist/SHA256SUMS
          retention-days: 3
