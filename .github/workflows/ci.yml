name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: switchtender
          POSTGRES_PASSWORD: switchtender
          POSTGRES_DB: switchtender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchtender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SWITCHTENDER_TEST_POSTGRES_DSN: postgres://switchtender:switchtender@localhost:5432/switchtender?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: JS unit tests
        run: node --test internal/ui/assets/jstest/*.test.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ansible
        run: pipx install ansible-core
      - name: Run the real SSH fleet suite
        run: go test -tags integration -v -timeout 10m ./internal/integration/...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          if ! go run golang.org/x/vuln/cmd/govulncheck@latest ./...; then
            echo "::warning title=govulncheck::Vulnerabilities found; review the log above."
          fi
