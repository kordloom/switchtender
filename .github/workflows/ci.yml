name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: switchtender
          POSTGRES_PASSWORD: switchtender
          POSTGRES_DB: switchtender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchtender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SWITCHTENDER_TEST_POSTGRES_DSN: postgres://switchtender:switchtender@localhost:5432/switchtender?sslmode=disable
    steps:
      # Full depth: the secret scan below reads every commit, and a shallow clone
      # would report a clean history it never looked at.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: JS unit tests
        run: node --test internal/ui/assets/jstest/*.test.mjs

      # site/ is partly generated: sitegen renders docs/*.md into site/docs/ and refreshes shared
      # regions inside the hand-written landing pages. Nothing checked that the committed output
      # matched its source, so an edit to the markdown left the published page stale, and an edit
      # made directly to the generated HTML was silently reverted the next time anyone ran the
      # generator. Both happened: switchtender.com/docs/features published five Team-only features
      # as free for a week, and a corrected pricing claim lived only in generated output. The
      # generator's own source says editing the output "gets clobbered on the next run, which is
      # how one card was lost once", which is a warning a person can read and CI can enforce.
      # The chart is a shipped install path with no compiler behind it, and it has been wrong four
      # separate ways: an image name Kubernetes resolved to Docker Hub, an appVersion a release
      # behind, a readiness probe that kept a pod with an unreachable database in the Service, and
      # no way at all to supply a license, which made the Team worker it deploys a pod that could
      # never start. Rendering it in CI catches the shape; nothing catches it today.
      - name: Helm chart renders
        run: |
          set -euo pipefail
          curl -sSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar -xz -C /tmp
          helm=/tmp/linux-amd64/helm
          "$helm" lint deploy/helm/switchtender --set encryptionKey=k --set encryptionSalt=s
          # The two real shapes: Community on SQLite, and Team on PostgreSQL with a worker and a
          # signing identity. The supertest installs both into a live cluster; this render is the
          # cheap first line.
          "$helm" template t deploy/helm/switchtender --set encryptionKey=k --set encryptionSalt=s > /tmp/community.yaml
          "$helm" template t deploy/helm/switchtender --set encryptionKey=k --set encryptionSalt=s \
            --set database.dsn=postgres://u:p@postgres/db --set auditKey=aa \
            --set license=LIC --set worker.enabled=true > /tmp/team.yaml
          # The chart must name the published image, not a bare name Kubernetes reads as Docker Hub.
          grep -q 'image: "ghcr.io/kordloom/switchtender:' /tmp/community.yaml
          # Readiness must ask whether the store is reachable, not merely whether the process is up.
          grep -q 'path: /readyz' /tmp/community.yaml
          # Community keeps its whole install on a claim and never updates with two writers alive.
          grep -q 'PersistentVolumeClaim' /tmp/community.yaml
          grep -q 'type: Recreate' /tmp/community.yaml
          grep -q '/data/switchtender.db' /tmp/community.yaml
          # A Team install must carry its license and its signing identity to the server AND the
          # worker; either one missing makes a process that refuses to start or a chain nobody
          # signed.
          test "$(grep -c 'SWITCHTENDER_LICENSE' /tmp/team.yaml)" = "2"
          test "$(grep -c 'SWITCHTENDER_AUDIT_KEY' /tmp/team.yaml)" = "5"
          # A Community install must carry none of that plumbing, and no claim belongs to Team.
          ! grep -q 'SWITCHTENDER_LICENSE' /tmp/community.yaml
          ! grep -q 'PersistentVolumeClaim' /tmp/team.yaml
          # The shapes that cannot work refuse at render time, each with its sentence: two SQLite
          # writers, a worker with no shared database, and a PostgreSQL install with no signing
          # identity.
          ! "$helm" template t deploy/helm/switchtender --set encryptionKey=k --set encryptionSalt=s \
            --set server.replicas=2 >/dev/null 2>&1
          ! "$helm" template t deploy/helm/switchtender --set encryptionKey=k --set encryptionSalt=s \
            --set worker.enabled=true >/dev/null 2>&1
          ! "$helm" template t deploy/helm/switchtender --set encryptionKey=k --set encryptionSalt=s \
            --set database.dsn=postgres://u:p@postgres/db >/dev/null 2>&1
          ! "$helm" template t deploy/helm/switchtender --set encryptionKey=k --set encryptionSalt=s \
            --set database.dsn=postgres://u:p@postgres/db --set auditKey=aa \
            --set worker.enabled=true >/dev/null 2>&1
          # SQLite mode's Recreate must null the rolling parameters, or an upgrade from a
          # RollingUpdate deployment is refused by the API server.
          grep -q 'rollingUpdate: null' /tmp/community.yaml
          # The chart's appVersion must not fall BEHIND the newest release. Ahead is fine and normal:
          # the chart is bumped while the next version is being prepared. Behind is the defect, and
          # it shipped a chart pinned a release back while the demo and README advertised the new one.
          chart="$(grep -m1 '^appVersion:' deploy/helm/switchtender/Chart.yaml | tr -d '\"' | awk '{print $2}')"
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$chart" "$latest" | sort -V | head -1)" = "$chart" ] \
             && [ "$chart" != "$latest" ]; then
            echo "::error title=Helm chart is stale::Chart.yaml appVersion is $chart, behind release $latest"
            exit 1
          fi

      - name: Generated site content is current
        run: |
          set -euo pipefail
          go run ./cmd/sitegen
          if ! git diff --quiet -- site/; then
            echo "::error title=Generated site content is stale::run 'go run ./cmd/sitegen' and commit the result. Never edit the generated output by hand: sitegen rewrites it."
            git --no-pager diff --stat -- site/
            exit 1
          fi

      # A product selling evidence should scan clean, and a stranger will run this. History rather
      # than the working tree: the config allowlists the redaction tests, whose fixtures must look
      # like secrets, one file at a time rather than exempting every _test.go, so a real credential
      # pasted into a future test still fails here.
      # The binary rather than gitleaks-action, whose v2 asks an organization account for a
      # license key. The scan is the point; the wrapper is not.
      - name: Secret scan
        run: |
          set -euo pipefail
          version=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --log-opts="--all" --redact --no-banner

  # The audit package cross-checks every bundle shape this product emits against the loomseal
  # verifier a relying party would actually run, and requires both to reach the same verdict. That
  # harness locates the verifier in a checkout beside this one and skips when it is absent, so on a
  # runner that clones only this repository it silently skipped: the strongest claim the product
  # makes had no automated gate anywhere, and drift would have been found by a customer. Checking
  # out the exact version this module depends on is what makes the check run.
  crossverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: switchtender
      - uses: actions/setup-go@v5
        with:
          go-version-file: switchtender/go.mod
      - name: Check out the loomseal version this module depends on
        working-directory: switchtender
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/kordloom/loomseal)"
          echo "cross-checking against loomseal $version"
          git clone --quiet https://github.com/kordloom/loomseal.git ../loomseal
          git -C ../loomseal checkout --quiet "$version"
      - name: Cross-verify every bundle shape
        working-directory: switchtender
        run: go test -count=1 ./internal/audit/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ansible
        run: pipx install ansible-core
      - name: Run the real SSH fleet suite
        run: go test -tags integration -v -timeout 10m ./internal/integration/...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A finding fails the job. It was downgraded to a warning, which meant the check could never
      # stop anything: a real advisory in a package this code calls would have gone by as a yellow
      # annotation nobody opens. The scan reports only vulnerabilities actually reachable from this
      # code, so a hit is worth stopping for, and an unfixable one is silenced by name in the config
      # rather than by ignoring every result.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Real-browser tests. The js unit job above drives the same production JavaScript against a simulated
  # DOM, which proves the logic but not that a page renders, clicks through, and mutates in a real
  # engine. This job runs headless Chromium against two servers: a seeded read-only demo for rendering
  # and navigation, and a writable serve instance where it launches a run and creates objects and checks
  # the change persisted. It catches layout, CSS, and browser-only breakage the simulated DOM cannot see.
  ui-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/ui/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the binary the demo server runs from
        run: npm run build:bin
      - name: Run the smoke tests
        run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: internal/ui/e2e/playwright-report/
          retention-days: 7
