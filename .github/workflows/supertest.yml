# The supertest: a fresh Kind cluster, both install tiers, three real SSH machines, and no
# assertion that trusts the product's own word for what happened. test/supertest is the harness;
# docs/supertest.md is the guide to reading a run. The report lands in the job summary and the UI
# screenshots in the artifacts, so an evaluator reads the evidence without cloning anything.
name: supertest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supertest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supertest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade phase resolves the previous release from the repository's own tags, and
          # fetch-tags quietly fetches nothing at the default shallow depth.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind and helm
        env:
          # The SHA-256 kind publishes beside the binary, in kind-linux-amd64.sha256sum. A download
          # that does not match is not run.
          KIND_SHA256: b89aada5a39d620da3fcd16435b7f28d858927dd53f92cbac77686b0588b600d
          # The SHA-256 get.helm.sh publishes beside the archive, in
          # helm-v3.16.3-linux-amd64.tar.gz.sha256sum. A download that does not match is not run.
          HELM_SHA256: f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind \
            https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          echo "$KIND_SHA256  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz
          echo "$HELM_SHA256  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      # The same Node ci pins, not whatever the runner image ships this month: the screenshot
      # tooling must not change behavior because the image rolled.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the browser the screenshots use
        working-directory: internal/ui/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the supertest
        run: |
          set -euo pipefail
          # The public tree builds the Community binary, which cannot do the paid things because
          # the code that does them is not in it, so the Team tier is exercised by the paid
          # module's own pipeline against the paid build. This run covers the Community tier.
          go run ./test/supertest \
            -skip-team \
            -shots /tmp/supertest-shots \
            -report "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supertest-evidence
          path: /tmp/supertest-shots
          if-no-files-found: ignore
